[package]
name = "deltactl"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "^0.4.45", default-features = false }
clap = { version = "^4.6.6", features = ["derive", "env"] }
deltalake = { version = "^0.32.4" }
humantime = "^2.4.0"
serde = { version = "^1.0.229", default-features = false }
serde_json = "^1.0.151"
tokio = { version = "^1.53.1", default-features = false, features = [
    "rt-multi-thread",
    "macros",
] }
url = { version = "^2.5.8", default-features = false }
anyhow = { version = "^1.0.104", default-features = false }

[features]
azure = ["deltalake/azure"]
s3 = ["deltalake/s3"]
datafusion = ["deltalake/datafusion"]

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"

[lints.clippy]
# Pedantic
pedantic = { level = "warn", priority = -1 }
cast_precision_loss = "allow"
default_trait_access = "allow"
missing_errors_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
struct_excessive_bools = "allow"
map_unwrap_or = "allow"
unnecessary_debug_formatting = "allow"
implicit_hasher = "allow"

# Nursery
nursery = { level = "warn", priority = -1 }
option_if_let_else = "allow"

# Cargo
wildcard_dependencies = "warn"

# Restriction
allow_attributes = "warn"
clone_on_ref_ptr = "warn"
create_dir = "warn"
dbg_macro = "warn"
exit = "warn"
string_to_string = "warn"
undocumented_unsafe_blocks = "warn"
unwrap_used = "warn"
